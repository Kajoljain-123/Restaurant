<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DelishBite Restaurant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f8f8;
    }
    header {
      background: #111;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .item {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 15px;
    }
    .item img {
      width: 100%;
      border-radius: 10px;
    }
    .item h3 {
      margin: 10px 0 5px;
    }
    .item p {
      color: #555;
    }
    .item button {
      background: #111;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    .item button:hover {
      background: #333;
    }
    .cart {
      margin-top: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    .cart h2 {
      margin-top: 0;
    }
    .cart ul {
      list-style: none;
      padding: 0;
    }
    .cart li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .checkout {
      margin-top: 20px;
      background: green;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #111;
      color: #fff;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>DelishBite Restaurant</h1>
  <p>Order your favorite food online</p>
</header>

<div class="container">
  <h2>Menu</h2>
  <div class="menu">
    <div class="item">
      <img src="https://via.placeholder.com/300x200" alt="Pizza" />
      <h3>Cheese Pizza</h3>
      <p>₹250</p>
      <button onclick="addToCart('Cheese Pizza', 250)">Add to Cart</button>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/300x200" alt="Burger" />
      <h3>Veg Burger</h3>
      <p>₹150</p>
      <button onclick="addToCart('Veg Burger', 150)">Add to Cart</button>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/300x200" alt="Pasta" />
      <h3>White Sauce Pasta</h3>
      <p>₹220</p>
      <button onclick="addToCart('White Sauce Pasta', 220)">Add to Cart</button>
    </div>
  </div>

  <div class="cart">
    <h2>Your Order</h2>
    <ul id="cartItems"></ul>
    <h3 id="total">Total: ₹0</h3>
    <button class="checkout" onclick="checkout()">Place Order</button>
  </div>
</div>

<footer>
  <p>© 2026 DelishBite Restaurant</p>
</footer>

<script>
  let cart = [];
  let total = 0;

  function addToCart(name, price) {
    cart.push({ name, price });
    total += price;
    renderCart();
  }

  function renderCart() {
    const cartItems = document.getElementById('cartItems');
    cartItems.innerHTML = '';
    cart.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${item.name}</span><span>₹${item.price}</span>`;
      cartItems.appendChild(li);
    });
    document.getElementById('total').innerText = `Total: ₹${total}`;
  }

  function checkout() {
    if (cart.length === 0) {
      alert('Your cart is empty!');
      return;
    }
    alert('Order placed successfully!');
    cart = [];
    total = 0;
    renderCart();
  }
</script>

</body>
</html>
